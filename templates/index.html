<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Todo</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash">
          {% for m in messages %}
            <li>{{ m }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form class="add" method="post" action="{{ url_for('create_todo') }}">
      <input name="title" placeholder="やることを入力" maxlength="200" />
      <button type="submit">追加</button>
    </form>

    <ul class="list">
      {% for todo in todos %}
        <li class="item">
          <div class="title {% if todo.done %}done{% endif %}">
            {{ todo.title }}
          </div>

          <div class="actions">
            <form method="post" action="{{ url_for('toggle_todo', todo_id=todo.id) }}">
              <button type="submit">{% if todo.done %}未完了{% else %}完了{% endif %}</button>
            </form>

            <form method="post" action="{{ url_for('delete_todo', todo_id=todo.id) }}"
                  onsubmit="return confirm('削除しますか？');">
              <button type="submit" class="danger">削除</button>
            </form>
          </div>
        </li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
